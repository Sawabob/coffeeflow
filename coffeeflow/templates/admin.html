{% extends 'base.html' %}
{% block title %}Панель працівника — CoffeeFlow{% endblock %}
{% block content %}
<div class="page-heading row-between"><div><p class="eyebrow">COFFEEFLOW / ДЛЯ КОМАНДИ</p><h1>Усе під контролем.</h1></div><button id="logout" class="button secondary" hidden>Вийти</button></div>
<p id="admin-loading" class="loading">Перевіряємо доступ…</p>
<form id="login-form" class="panel login-panel" hidden><h2>Вхід працівника</h2><p class="muted">Керуйте меню та замовленнями кав’ярні.</p><label>Логін<input name="username" autocomplete="username" required minlength="3" maxlength="40"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><div id="login-error" class="message error" role="alert" hidden></div><button class="button primary full" type="submit">Увійти →</button></form>
<div id="admin-app" hidden><div class="admin-toolbar"><div class="chips" role="tablist" aria-label="Розділи панелі"><button type="button" role="tab" id="tab-orders" aria-controls="admin-orders" aria-selected="true" data-tab="orders">Замовлення</button><button type="button" role="tab" id="tab-products" aria-controls="admin-products" aria-selected="false" data-tab="products">Меню</button><button type="button" role="tab" id="tab-categories" aria-controls="admin-categories" aria-selected="false" data-tab="categories">Категорії</button></div><button id="admin-refresh" class="button secondary">Оновити</button></div>
<div id="admin-error" class="message error" role="alert" hidden></div>
<section id="admin-orders" role="tabpanel" aria-labelledby="tab-orders"><div class="row-between"><h2>Черга замовлень</h2><label class="inline-label">Статус<select id="status-filter"><option value="">Усі</option><option value="new">Нові</option><option value="accepted">Прийняті</option><option value="preparing">Готуються</option><option value="ready">Готові</option><option value="completed">Завершені</option><option value="cancelled">Скасовані</option></select></label></div><div id="admin-orders-list" aria-live="polite"></div></section>
<section id="admin-products" role="tabpanel" aria-labelledby="tab-products" hidden><div class="row-between"><h2>Товари меню</h2><button id="new-product" class="button primary">+ Додати товар</button></div><div id="admin-product-list" class="admin-grid" aria-live="polite"></div></section>
<section id="admin-categories" role="tabpanel" aria-labelledby="tab-categories" hidden><div class="row-between"><h2>Категорії</h2><button id="new-category" class="button primary">+ Додати категорію</button></div><div id="admin-category-list" aria-live="polite"></div></section></div>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-heading"><h2 id="editor-title"></h2><button id="close-editor" type="button" class="icon-button" aria-label="Закрити">×</button></div><form id="editor-form"><div id="editor-fields"></div><div id="editor-error" class="message error" role="alert" hidden></div><button class="button primary full" type="submit">Зберегти</button></form></dialog>
{% endblock %}
